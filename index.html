<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中转助手</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1d2433;--muted:#6b7385;--line:#e4e8ef;--pri:#2563eb;--pri2:#1e4fc2;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
header{background:#111827;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px}
header h1{font-size:17px;margin:0;font-weight:600}
header .host{color:#9ca3af;font-size:12px}
header nav{margin-left:auto;display:flex;gap:6px}
header nav button{background:transparent;color:#cbd5e1;border:1px solid #374151;border-radius:8px;padding:6px 14px;cursor:pointer}
header nav button.on{background:#fff;color:#111827;border-color:#fff}
main{max-width:1360px;margin:18px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;border:1px solid #cfd6e2;border-radius:8px;padding:7px 10px;background:#fff;color:var(--text)}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--pri)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #cfd6e2;background:#fff;padding:7px 14px;color:var(--text)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri2)}
button.danger{color:var(--bad);border-color:#f3c2c2}
button.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500;background:#fafbfc}
td.mono,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip);color:#3730a3}
.tag.ok{background:#dcfce7;color:#166534}.tag.bad{background:#fee2e2;color:#991b1b}.tag.warn{background:#fef3c7;color:#92400e}.tag.gray{background:#f1f5f9;color:#64748b}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.res{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.res .name{font-weight:600;word-break:break-all}
.res .qr svg{width:180px;height:180px}
.res .link{font-size:11px;word-break:break-all;color:var(--muted);max-height:48px;overflow:hidden;margin:6px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .grow{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;z-index:9}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.login{max-width:360px;margin:12vh auto}
.protos{display:flex;gap:6px;flex-wrap:wrap}.ck{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:5px;border:1px solid #cfd6e2;border-radius:8px;padding:6px 10px;color:var(--text)!important;font-size:13px!important;cursor:pointer;background:#fff}
.ck input{margin:0}
.btnlink{display:inline-block;border:1px solid #cfd6e2;border-radius:8px;padding:3px 9px;font-size:12px;color:var(--text);text-decoration:none;background:#fff}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.tag{white-space:nowrap}.clk{cursor:pointer}.clk:hover{filter:brightness(.95);text-decoration:underline}th{white-space:nowrap}td.mono{white-space:nowrap}
.bar{height:5px;background:#eef2f7;border-radius:3px;overflow:hidden;margin:3px 0;width:100px}.bar i{display:block;height:100%}
.dupbox{margin-top:6px;font-size:12px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 8px}.dupbox select{margin-top:4px;width:100%;font-size:12px;padding:4px 6px}
.warnbox{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:12px;padding:14px 16px;margin-bottom:16px;line-height:1.7}
tbody.grp{border-bottom:2px solid #dbe2ec}tbody.grp tr.sub td{border-bottom:1px dashed var(--line)}tbody.grp tr.sub{background:#fbfcfe}.branch{color:#94a3b8;margin-right:6px}.sib{font-size:11px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:70px 1fr auto;gap:6px 8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.kv b{font-weight:500;color:var(--muted);font-size:12px}.kv span{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.muted{color:var(--muted)}
.err{color:var(--bad)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:720px){.hide-sm{display:none}header{flex-wrap:wrap}header nav{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
const BASE="__BASE__";
const $=s=>document.querySelector(s);
const H=(sel,html)=>{const e=document.querySelector(sel);if(e)e.innerHTML=html;return e};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state={tab:"create",preview:null,results:null,relays:[],now:0,host:"",q:"",page:1,sel:new Set(),checks:{},busy:false};

async function api(a,body){
  const r=await fetch(BASE+"api/"+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({ok:false,error:"服务器无响应"}));
  if(j.login){renderLogin();throw new Error("请先登录")}
  if(!j.ok)throw new Error(j.error||"操作失败");
  return j;
}
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms)}
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("已复制")).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("已复制")})}
function coreMsg(c){if(c==="restarted")return "，已重启 s-ui 使路由生效（约 3 秒断线）";if(c==="down")return "。⚠ s-ui 内核未能启动，请登录服务器执行 systemctl restart s-ui";return ""}
const fmtDate=ts=>{if(!ts)return "永久";const d=new Date(ts*1000);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
function daysLeft(ts){if(!ts)return null;const d=(ts*1000-Date.now())/86400000;return d<0?-1:Math.ceil(d)}
function expTag(r){const d=daysLeft(r.expiry);if(d!==null&&d<0)return '<span class="tag bad">已过期</span>';if(r.enable===false)return '<span class="tag gray">已停用</span>';if(d===null)return '<span class="tag ok">永久</span>';if(d<0)return '<span class="tag bad">已过期</span>';if(d<=7)return `<span class="tag warn">${d} 天</span>`;return `<span class="tag ok">${d} 天</span>`}
const protoName={vless:"VLESS-Reality",vless443:"VLESS-443共用",hysteria2:"Hysteria2",socks:"SOCKS5",mixed:"Mixed",vmess:"VMess",trojan:"Trojan",shadowsocks:"SS",tuic:"TUIC",anytls:"AnyTLS",http:"HTTP"};

function renderLogin(){
  $("#app").innerHTML=`<div class="card login"><h2>中转助手 · 登录</h2>
  <input id="pw" type="password" placeholder="登录密码" style="width:100%" autofocus>
  <div style="margin-top:12px"><button class="pri" id="lg" style="width:100%">登录</button></div><p class="err" id="lerr"></p></div>`;
  const go=async()=>{try{await api("login",{password:$("#pw").value});init()}catch(e){$("#lerr").textContent=e.message}};
  $("#lg").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

function shell(){
  $("#app").innerHTML=`<header><h1>中转助手</h1><span class="host" id="hostinfo"></span>
  <nav><button data-t="create">一键中转</button><button data-t="manage">线路管理</button><button data-t="backup">备份</button><button data-t="settings">设置</button><button id="logout">退出</button></nav></header><main id="main"></main>`;
  document.querySelectorAll("header nav button[data-t]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render()});
  $("#logout").onclick=async()=>{await fetch(BASE+"api/logout",{method:"POST"});renderLogin()};
}
function render(){
  document.querySelectorAll("header nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===state.tab));
  if(state.tab==="create")renderCreate();else if(state.tab==="backup")renderBackup();else if(state.tab==="settings")renderSettings();else renderManage();
}

/* ---------------- 一键中转 ---------------- */
function renderCreate(){
  const m=$("#main");
  const saved=JSON.parse(localStorage.getItem("rh_form")||"{}");
  m.innerHTML=`<div class="card"><h2>1. 选择类型</h2>
  <div class="modes" id="modes"><label class="ck"><input type="radio" name="mode" value="relay">中转（粘贴落地，走落地 IP 出网）</label>
  <label class="ck"><input type="radio" name="mode" value="direct">直连（不用落地，走本服务器 IP 出网）</label></div>
  <div class="row" style="margin-top:12px">
    <label>客户名 <input id="cust" placeholder="如：见山" value="${esc(saved.cust||"")}"></label>
    <label>入站协议（客户连接用，可多选）<span class="protos" id="protos">
      <label class="ck"><input type="checkbox" value="vless">VLESS-Reality</label>
      <label class="ck"><input type="checkbox" value="hysteria2">Hysteria2</label>
      <label class="ck"><input type="checkbox" value="socks">SOCKS5</label>
      <label class="ck" title="所有客户共用一个 443 端口（像普通 HTTPS），按用户分流到各自落地；不占新端口"><input type="checkbox" value="vless443">VLESS-443 共用</label></span></label>
    <label>到期 <select id="days"><option value="30">30 天</option><option value="60">60 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option><option value="0">永久</option><option value="custom">指定日期…</option></select></label>
    <label id="cdl" style="display:none">到期日期 <input id="cdate" type="datetime-local"></label>
    <label>流量上限 GB（0=不限）<input id="qgb" type="number" min="0" step="1" value="${esc(saved.qgb??0)}" style="width:120px"></label>
    <label>设备数（0=不限）<input id="qdev" type="number" min="0" step="1" value="${esc(saved.qdev??0)}" style="width:110px"></label>
  </div>
  <div id="dcnt" class="row" style="margin-top:12px;display:none"><label>创建几条直连线路<input id="dn" type="number" min="1" max="100" value="1" style="width:110px"></label>
    <span class="hint">每条线路单独计流量、设备和到期；出口 IP 都是本服务器（${esc(state.host||"")}）。</span></div>
  <div style="margin-top:12px" id="txtbox"><textarea id="txt" placeholder="每行一条落地，支持：
socks5://账号:密码@IP:端口
IP:端口:账号:密码
vless://…  hy2://…  ss://…  trojan://…  vmess://…  tuic://…
也可以在前面加名字：  我的线路A socks5://账号:密码@IP:端口"></textarea></div>
  <p class="hint" id="relayhint">节点名自动生成为「落地国家 + 客户名 + 落地IP」，下一步可以改。多选协议时，同一落地会生成多个节点（第二个起名字后加 -HY2 / -S5），共用这个落地。</p>
  <div class="row" style="margin-top:10px"><button class="pri" id="pv">解析预览</button></div></div>
  <div id="pvbox"></div><div id="resbox"></div>`;
  const sp=saved.protos||[saved.proto||"vless"];document.querySelectorAll("#protos input").forEach(c=>c.checked=sp.includes(c.value));
  $("#days").value=saved.days||"30";
  const sync=()=>{$("#cdl").style.display=$("#days").value==="custom"?"flex":"none"};$("#days").onchange=sync;sync();
  $("#pv").onclick=doPreview;
  const md=state.mode||saved.mode||"relay";document.querySelector(`#modes input[value=${md}]`).checked=true;
  const msync=()=>{const d=curMode()==="direct";state.mode=curMode();$("#txtbox").style.display=d?"none":"";$("#relayhint").style.display=d?"none":"";$("#dcnt").style.display=d?"flex":"none"};
  document.querySelectorAll("#modes input").forEach(r=>r.onchange=()=>{msync();state.preview=null;H("#pvbox","")});msync();
  if(state.text)$("#txt").value=state.text;$("#txt").oninput=()=>{state.text=$("#txt").value};
  if(state.preview)renderPreview();if(state.results)renderResults();
}
const curMode=()=>(document.querySelector("#modes input:checked")||{}).value||"relay";
function selProtos(sel="#protos"){return [...document.querySelectorAll(sel+" input:checked")].map(c=>c.value)}
function expiryTs(){const v=$("#days").value;if(v==="0")return 0;if(v==="custom"){const d=$("#cdate").value;if(!d)throw new Error("请选择到期日期");return Math.floor(new Date(d).getTime()/1000)}return Math.floor(Date.now()/1000)+parseInt(v)*86400}
async function doPreview(){
  const b=$("#pv");b.disabled=true;b.innerHTML='<span class="spin"></span> 解析中';
  localStorage.setItem("rh_form",JSON.stringify({cust:$("#cust").value,protos:selProtos(),days:$("#days").value,qgb:$("#qgb").value,qdev:$("#qdev").value,mode:curMode()}));
  try{const r=await api("preview",curMode()==="direct"?{direct:true,count:parseInt($("#dn").value||"1"),customer:$("#cust").value.trim()}:{text:$("#txt").value,customer:$("#cust").value.trim()});state.preview=r.items;state.pvcheck={};state.results=null;H("#resbox","");renderPreview()}
  catch(e){toast(e.message)}finally{const bb=$("#pv");if(bb){bb.disabled=false;bb.textContent="解析预览"}}
}
function pvMode(x){if(x.mode)return x.mode;return (x.dup||[]).length?"attach:"+x.dup[0].tag:"new"}
function renderPreview(){
  const it=state.preview||[];const good=it.filter(x=>!x.error).length;
  if(!$("#pvbox"))return;
  it.forEach(x=>{if(!x.error)x.mode=pvMode(x)});
  const cnt=m=>it.filter(x=>!x.error&&(m==="attach"?x.mode.startsWith("attach:"):x.mode===m)).length;
  const nNew=cnt("new"),nAtt=cnt("attach"),nDup=it.filter(x=>!x.error&&((x.dup||[]).length||x.dup_in_batch!==undefined)).length;
  $("#pvbox").innerHTML=`<div class="card"><h2>2. 确认线路（${good} 条可用${it.length-good?`，${it.length-good} 条有误`:""}${nDup?`，<span style="color:var(--warn)">${nDup} 条落地重复</span>`:""}）</h2>
  <div style="overflow:auto"><table><tr><th>#</th><th>节点名（可改）</th><th>落地</th><th class="hide-sm">类型</th><th>检测</th></tr>
  ${it.map((x,i)=>x.error?`<tr><td>${i+1}</td><td colspan="4"><span class="err">✗ ${esc(x.error)}</span> <span class="mono muted">${esc(x.raw)}</span></td></tr>`:
  `<tr><td>${i+1}</td><td><input data-i="${i}" class="nm" value="${esc(x.name)}" style="width:100%;min-width:180px" ${x.mode==="new"?"":"disabled"}>
   ${(x.dup||[]).length||x.dup_in_batch!==undefined?`<div class="dupbox">
     ${(x.dup||[]).length?`⚠ 这个落地已被「${esc(x.dup[0].tag)}」使用（${x.dup[0].types.map(y=>esc(protoName[y]||y)).join("、")}）${x.dup.length>1?` 等 ${x.dup.length} 条线路`:""}`:""}
     ${x.dup_in_batch!==undefined?`⚠ 和本次第 ${x.dup_in_batch} 行是同一个落地`:""}
     <select data-m="${i}">
       ${(x.dup||[]).map(d=>`<option value="attach:${esc(d.tag)}" ${x.mode==="attach:"+d.tag?"selected":""}>挂到「${esc(d.tag)}」上（加协议，共用落地，到期跟原线路）</option>`).join("")}
       <option value="new" ${x.mode==="new"?"selected":""}>新建独立线路（单独的出站和到期）</option>
       <option value="skip" ${x.mode==="skip"?"selected":""}>跳过这条</option>
     </select></div>`:""}</td>
   <td class="mono">${x.direct?`本机直连 ${esc(x.ip)}`:`${esc(x.outbound.server)}:${esc(x.outbound.server_port)}`}${x.country?` <span class="tag">${esc(x.country)}</span>`:""}</td>
   <td class="hide-sm">${x.direct?"直连":esc(protoName[x.outbound.type]||x.outbound.type)}</td><td id="pc${i}">${pcHtml(state.pvcheck&&state.pvcheck[i])}</td></tr>`).join("")}
  </table></div>
  <div class="row" style="margin-top:12px"><button id="pchk">检测落地</button><button class="pri" id="mk" ${nNew+nAtt?"":"disabled"}>${nNew?`新建 ${nNew} 条`:""}${nNew&&nAtt?" + ":""}${nAtt?`挂到原线路 ${nAtt} 条`:""}${!nNew&&!nAtt?"没有要处理的":""}</button>
  <span class="hint">完成后会自动重启 s-ui 让路由生效，所有线路约断 3 秒。</span></div></div>`;
  document.querySelectorAll(".nm").forEach(n=>n.oninput=()=>{state.preview[n.dataset.i].name=n.value.trim()});
  document.querySelectorAll("[data-m]").forEach(s=>s.onchange=()=>{state.preview[s.dataset.m].mode=s.value;renderPreview()});
  $("#pchk").onclick=preCheck;$("#mk").onclick=doCreate;
}
function pcHtml(c){if(!c)return '<span class="muted">-</span>';if(c==="..")return '<span class="spin"></span>';return c.ok?`<span class="tag ok">通 ${c.delay}ms</span>`:`<span class="tag bad" title="${esc(c.error)}">不通</span>`}
async function preCheck(){
  const idx=[];const items=[];state.pvcheck={};
  state.preview.forEach((x,i)=>{if(!x.error){idx.push(i);items.push(x);state.pvcheck[i]="..";H("#pc"+i,pcHtml(".."))}});
  try{const r=await api("check_raw",{items});r.results.forEach((c,k)=>{state.pvcheck[idx[k]]=c;H("#pc"+idx[k],pcHtml(c))});
    const bad=r.results.filter(c=>!c.ok).length;toast(bad?`${bad} 条落地不通，鼠标悬停看原因`:"全部落地连通")}
  catch(e){toast(e.message)}
}
async function doCreate(){
  let expiry;try{expiry=expiryTs()}catch(e){return toast(e.message)}
  const valid=state.preview.filter(x=>!x.error&&x.name);
  const items=valid.filter(x=>x.mode==="new");
  const attach=[...new Set(valid.filter(x=>x.mode.startsWith("attach:")).map(x=>x.mode.slice(7)))];
  const protos=selProtos();if(!protos.length)return toast("请至少勾选一个入站协议");
  if(!items.length&&!attach.length)return toast("没有要处理的线路");
  const badN=Object.values(state.pvcheck||{}).filter(c=>c&&c!==".."&&!c.ok).length;
  const lines=[];if(items.length)lines.push(`新建 ${items.length} 条落地 × ${protos.length} 种协议 = ${items.length*protos.length} 个节点`);
  if(attach.length)lines.push(`给 ${attach.length} 条已有线路加上所选协议（已有的协议自动跳过）`);
  if(!confirm(`${badN?`⚠ 有 ${badN} 条落地检测不通，仍会一起处理。\n\n`:""}${lines.join("\n")}\n\n完成后会重启 s-ui 让路由生效，所有线路约断 3 秒。确定？`))return;
  const b=$("#mk");b.disabled=true;b.innerHTML='<span class="spin"></span> 处理中…';
  try{let results=[],core="ok";
    if(items.length){const r=await api("create",{items,protocols:protos,expiry,customer:$("#cust").value.trim(),quota_gb:parseFloat($("#qgb").value||"0")||0,devices:parseInt($("#qdev").value||"0")||0});results=results.concat(r.results);core=r.core}
    let skipped=0;

const safeName=n=>String(n||"qr").replace(/[\\/:*?"<>|\r\n]/g,"_").trim()||"qr";
function qrPng(name,svg,port){
  return new Promise(res=>{
    if(!svg)return res(null);
    const img=new Image();img.onload=()=>{const W=600,HH=700,c=document.createElement("canvas");c.width=W;c.height=HH;const g=c.getContext("2d");
      g.fillStyle="#fff";g.fillRect(0,0,W,HH);g.imageSmoothingEnabled=false;g.drawImage(img,40,30,520,520);
      g.fillStyle="#111";g.textAlign="center";g.font="bold 30px 'PingFang SC','Microsoft YaHei',sans-serif";g.fillText(name,W/2,600,W-30);

function saveBlob(blob,filename){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* 最小 ZIP 打包（不压缩，PNG 本身已压缩）；文件名用 UTF-8 并设置 UTF-8 标志，Windows 自带解压能正确显示中文 */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const name=enc.encode(f.name),data=f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h,name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    central.push(c,name);
    off+=30+name.length+data.length;
  }
  const cdSize=central.reduce((s,x)=>s+x.byteLength,0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}
/* items: [{name, svg, port, uri}]；缺二维码的会先向服务器取 */
async function downloadAllZip(items,zipName){
  if(!items.length)return toast("没有可下载的二维码");
  toast(`正在打包 ${items.length} 张二维码…`,60000);
  const files=[],used=new Set();
  for(const x of items){
    try{if(!x.svg&&x.uri){const q=await api("qr",{text:x.uri});x.svg=q.svg}}catch(e){}
    const b=await qrPng(x.name,x.svg,x.port);if(!b)continue;
    let n=safeName(x.name),k=2;while(used.has(n)){n=safeName(x.name)+"-"+k++}used.add(n);
    files.push({name:n+".png",data:new Uint8Array(await b.arrayBuffer())});
  }
  const p=n=>String(n).padStart(2,"0"),d=new Date();
  saveBlob(makeZip(files),safeName(zipName)+`_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.zip`);
  toast(`已下载压缩包（${files.length} 张二维码）`);
}

  ${one?`<div class="row"><label>当前端口<input value="${esc(rs[0].port)}" disabled style="width:110px"></label>
  <label>新端口（留空随机）<input id="npt" type="number" min="1" max="65535" style="width:160px" placeholder="随机"></label></div>`
  :`<div class="hint" style="max-height:160px;overflow:auto">${rs.map(r=>`${esc(r.tag)} <span class="mono">${esc(r.port)}</span>`).join("<br>")}</div><p class="hint">每个节点随机分配一个新端口。</p>`}
  <p class="hint">记得到云服务商安全组放行新端口（系统防火墙会自动放行）。</p>

  $("#pcl").onclick=closeModal;
  $("#pok").onclick=async()=>{const b=$("#pok");b.disabled=true;b.innerHTML='<span class="spin"></span> 更换中…';

      const x=await api("change_port",body);const ok=x.results.filter(r=>r.ok),bad=x.results.filter(r=>!r.ok);

      ${bad.length?`<p class="err">${esc(bad.map(r=>r.tag+"："+r.error).join("；"))}</p>`:""}

    const sp=x.active==="primary",cp=sp?x.state.active:x.state.standby,cb=sp?x.state.standby:x.state.active;
    H("#fosp",chk(cp));H("#fosb",chk(cb));H("#focp",esc(x.pcountry||"未知"));H("#focb",esc(x.bcountry||"未知"));
  }).catch(e=>{H("#fosp",'<span class="muted">检测失败</span>');H("#fosb","");H("#focp",esc(pri.country||"-"));H("#focb",esc((bak&&bak.country)||"-"))});
  const busy=(b,t)=>{b.disabled=true;b.innerHTML=`<span class="spin"></span> ${t}`};
  const refresh=async()=>{await loadRelays();drawTable()};
  $("#fook").onclick=async()=>{const b=$("#fook");const v=$("#fol").value.trim();if(!v)return H("#fomsg",'<span class="err">请填写备用落地</span>');busy(b,"检测中");
    try{const x=await api("failover_set",{tag,landing:v,auto_back:$("#foab").checked});
      H("#fomsg",x.check.ok?`<span class="tag ok">备用落地 ${esc(x.backup)} 已设置，连通 ${x.check.delay}ms</span>`:`<span class="tag bad">已设置，但备用落地 ${esc(x.backup)} 检测不通：${esc(x.check.error)}</span>`);
      await refresh();setTimeout(()=>{if($("#fomsg"))foDlg(tag)},1500)}catch(e){H("#fomsg",`<span class="err">${esc(e.message)}</span>`);b.disabled=false;b.textContent="保存并检测"}};
  if(f){
    $("#foab").onchange=async()=>{try{await api("failover_set",{tag,only_flag:true,auto_back:$("#foab").checked});await refresh();toast("已保存")}catch(e){toast(e.message)}};
    $("#fosw").onclick=async()=>{const to=act==="primary"?"backup":"primary";if(!confirm(`切到${to==="backup"?"备用":"主"}落地？正在使用的连接会断开重连（几秒）。`))return;busy($("#fosw"),"切换中");
      try{await api("failover_switch",{tag,to});await refresh();toast("已切换");foDlg(tag)}catch(e){toast(e.message,6000);foDlg(tag)}};
    $("#fodel").onclick=async()=>{if(!confirm("取消这条线路的备用落地？如果正在走备用，会先切回主落地。"))return;busy($("#fodel"),"处理中");
      try{await api("failover_set",{tag,landing:""});await refresh();toast("已取消备用落地");closeModal()}catch(e){toast(e.message,6000)}};
  }
}
function addProtoDlg(tags){
  const rs=tags.map(byTag).filter(r=>r&&r.outbound_tag);if(!rs.length)return toast("所选线路没有落地");
  const have=new Set();if(rs.length===1){have.add(rs[0].type);(rs[0].siblings||[]).forEach(s=>have.add(s.type))}
  const opt=[["vless","VLESS-Reality"],["vless443","VLESS-443 共用"],["hysteria2","Hysteria2"],["socks","SOCKS5"]];
  modal(`<h2 style="margin-top:0">加协议（${rs.length} 条线路）</h2>
  <p class="hint">给同一个落地再加其他协议的节点：共用这个落地出口，到期时间跟原线路一致。客户可以按网络情况选用。</p>
  <div class="protos" id="aps" style="margin:10px 0">${opt.map(([v,l])=>`<label class="ck"><input type="checkbox" value="${v}" ${have.has(v)?"disabled":""}>${l}${have.has(v)?"（已有）":""}</label>`).join("")}</div>
  ${rs.length>1?'<p class="hint">已有的协议会自动跳过。</p>':""}
  <div class="row"><button class="pri" id="apok">添加</button><button id="apcl">取消</button></div>`);
  $("#apcl").onclick=closeModal;
  $("#apok").onclick=async()=>{const protos=selProtos("#aps");if(!protos.length)return toast("请选择协议");
    if(!confirm("添加后会重启 s-ui 让路由生效，所有线路约断 3 秒。继续？"))return;
    const b=$("#apok");b.disabled=true;b.innerHTML='<span class="spin"></span> 添加中…';
    try{const x=await api("add_protocol",{tags:rs.map(r=>r.tag),protocols:protos});
      const ok=x.results.filter(z=>z.ok),skip=x.results.filter(z=>z.skipped),bad=x.results.filter(z=>!z.ok&&!z.skipped);
      toast(`新增 ${ok.length} 个节点${skip.length?`，跳过 ${skip.length} 个`:""}${bad.length?`，失败 ${bad.length} 个`:""}${coreMsg(x.core)}`,5000);
      await loadRelays();drawTable();showNew(ok,bad)}catch(e){toast(e.message,5000);if(b.isConnected){b.disabled=false;b.textContent="添加"}}};
}
async function showNew(ok,bad){
  if(!ok.length&&!bad.length)return closeModal();
  modal(`<h2 style="margin-top:0">新增节点（${ok.length}）</h2>${bad.map(x=>`<p class="err">✗ ${esc(x.name)}：${esc(x.error)}</p>`).join("")}
  <div class="results">${ok.map((x,i)=>`<div class="res"><div class="name">${esc(x.name)}</div><div class="muted">${esc(protoName[x.protocol]||"")} · 端口 ${x.port}</div>
  <div class="qr" id="nq${i}"><span class="spin"></span></div><div class="acts" style="justify-content:center"><button class="sm" data-ncp="${i}">复制链接</button><button class="sm" data-ndl="${i}">下载二维码</button></div></div>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="pri" id="ncpall">复制全部链接</button><button id="ndlall">下载全部二维码</button><button id="ncl">关闭</button></div>`);
  $("#ndlall").onclick=()=>downloadAllZip(ok.map(x=>({name:x.name,svg:x.svg,port:x.port,uri:(x.links||[])[0]})),"新增节点_二维码");
  $("#ncl").onclick=closeModal;$("#ncpall").onclick=()=>copy(ok.map(x=>(x.links||[])[0]).filter(Boolean).join("\n"));
  document.querySelectorAll("[data-ncp]").forEach(b=>b.onclick=()=>copy(ok[b.dataset.ncp].links[0]));
  for(let i=0;i<ok.length;i++){try{const q=await api("qr",{text:ok[i].links[0]});ok[i].svg=q.svg;H("#nq"+i,q.svg)}catch(e){}}
  document.querySelectorAll("[data-ndl]").forEach(b=>b.onclick=()=>{const x=ok[b.dataset.ndl];downloadQR(x.name,x.svg,x.port)});
}
function limitDlg(tags){
  const gs=[];const seen=new Set();for(const t of tags){const g=groupOf(t);if(!g.length)continue;const k=okeyOf(g[0]);if(!seen.has(k)){seen.add(k);gs.push(g)}}
  if(!gs.length)return;
  const L=gs.length===1?((state.limits||{})[okeyOf(gs[0][0])]||{}):{};
  const used=gs.length===1?gs[0].reduce((s,r)=>s+(r.up||0)+(r.down||0),0):null;
  modal(`<h2 style="margin-top:0">限额（${gs.length} 条线路）</h2>
  <p class="hint">按整条线路算：同一落地的几个协议节点流量合计、设备合计。流量用完整条线路自动停用；设备满了以后新设备连不上，旧设备断开约 3～4 分钟后释放名额。设备按客户的 IP 地址算，同一网络下的多台电脑算 1 台。</p>
  ${used!==null?`<p>当前已用：<b>${fmtB(used)}</b>${L.over?' <span class="tag bad">超流量，已停用</span>':""}</p>`:""}
  <div class="row"><label>流量上限 GB（0=不限）<input id="lq" type="number" min="0" step="1" value="${gs.length===1?(L.quota_gb||0):""}" placeholder="不修改" style="width:140px"></label>
  <label>设备数（0=不限）<input id="ld" type="number" min="0" step="1" value="${gs.length===1?(L.devices||0):""}" placeholder="不修改" style="width:120px"></label></div>
  <div class="row" style="margin-top:14px"><button class="pri" id="lok">保存</button><button id="lrst">流量清零</button><button id="lcl">取消</button></div>`);
  $("#lcl").onclick=closeModal;
  const tagsOf=()=>gs.map(g=>g[0].tag);
  $("#lok").onclick=async()=>{const body={tags:tagsOf()};if($("#lq").value!=="")body.quota_gb=parseFloat($("#lq").value)||0;if($("#ld").value!=="")body.devices=parseInt($("#ld").value)||0;
    if(!("quota_gb" in body)&&!("devices" in body))return toast("没有要修改的");
    try{await api("set_limits",body);closeModal();toast("已保存限额");await loadRelays();drawTable()}catch(e){toast(e.message)}};
  $("#lrst").onclick=async()=>{if(!confirm(`把 ${gs.length} 条线路的已用流量清零？超流量停用的会自动恢复（未过期的）。`))return;
    try{await api("reset_traffic",{tags:tagsOf()});closeModal();toast("已清零流量");await loadRelays();drawTable()}catch(e){toast(e.message)}};
}
function renewDlg(tags){
  const gmap=new Map();for(const t of expand(tags)){const r=byTag(t);if(r&&r.client_id){const k=gkey(r);if(!gmap.has(k))gmap.set(k,[]);gmap.get(k).push(r)}}
  const gs=[...gmap.values()];if(!gs.length)return toast("所选线路没有用户");
  const nn=gs.reduce((s,g)=>s+g.length,0);
  modal(`<h2 style="margin-top:0">续期 ${gs.length} 条线路（${nn} 个节点）</h2>
  ${nn>gs.length?'<p class="hint">同一落地的其他协议节点会一起续期，到期时间统一成同一天。</p>':""}
  <div class="row"><label>方式<select id="rm"><option value="add">在原到期时间上延长</option><option value="set">设为指定日期</option><option value="forever">改为永久</option></select></label>
  <label id="ral">延长天数<input id="rd" type="number" value="30" min="1" style="width:100px"></label>
  <label id="rsl" style="display:none">到期日期<input id="rdt" type="datetime-local"></label></div>
  <label class="ck" style="margin-top:8px"><input type="checkbox" id="rrst" checked>同时清零流量（流量限额重新计算）</label>
  <p class="hint">从这组里最晚的到期时间开始延长；已过期的从今天开始算；续期后自动重新启用。</p>
  <div class="row" style="margin-top:12px"><button class="pri" id="rnok">确定</button><button id="rncl">取消</button></div>`);
  const sync=()=>{const v=$("#rm").value;$("#ral").style.display=v==="add"?"flex":"none";$("#rsl").style.display=v==="set"?"flex":"none"};$("#rm").onchange=sync;
  $("#rncl").onclick=closeModal;
  $("#rnok").onclick=async()=>{const mode=$("#rm").value;const now=Math.floor(Date.now()/1000);
    try{let byExp={};
      for(const g of gs){let e;
        if(mode==="forever")e=0;
        else if(mode==="set"){if(!$("#rdt").value)throw new Error("请选择日期");e=Math.floor(new Date($("#rdt").value).getTime()/1000)}
        else{const base=g.some(r=>!r.expiry)?now:Math.max(...g.map(r=>r.expiry));e=Math.max(base,now)+parseInt($("#rd").value||"0")*86400}
        for(const r of g)(byExp[e]=byExp[e]||new Set()).add(r.client_id)}
      let fail=0;for(const[e,ids]of Object.entries(byExp)){const x=await api("update_clients",{client_ids:[...ids],expiry:parseInt(e),reset_traffic:$("#rrst").checked});fail+=x.results.filter(z=>!z.ok).length}
      closeModal();toast(fail?`${fail} 个失败`:`已续期 ${nn} 个节点`);await loadRelays();drawTable()}catch(e){toast(e.message)}};
}
async function setEnable(tags,en){
  const ids=[...new Set(expand(tags).map(byTag).filter(r=>r&&r.client_id).map(r=>r.client_id))];
  if(!en&&!confirm(`停用 ${ids.length} 个节点（含同落地的其他协议）？停用后客户无法连接。`))return;
  try{const x=await api("update_clients",{client_ids:ids,enable:en});toast(en?"已启用":"已停用");await loadRelays();drawTable()}catch(e){toast(e.message)}
}
async function delTags(tags){
  const set=new Set(tags);const left=[...new Set(tags.flatMap(t=>groupOf(t).filter(x=>!set.has(x.tag)).map(x=>x.tag)))];
  if(!confirm(`确定删除 ${tags.length} 个节点？${left.length?`\n同落地的这些节点会保留：${left.join("、")}`:"\n落地出站没有其他节点使用时会一起删除。"}\n删除后会重启 s-ui（约 3 秒断线），不可恢复。`))return;
  toast("删除中…",15000);
  try{const x=await api("delete",{tags});const bad=x.results.filter(r=>!r.ok);
    tags.forEach(t=>state.sel.delete(t));toast((bad.length?`${bad.length} 条失败：${bad.map(b=>b.error).join("；")}`:"已删除")+coreMsg(x.core),5000);
    await loadRelays();drawTable()}catch(e){toast(e.message)}
}

async function init(){
  shell();
  try{const s=await api("status");state.host=s.public_host;$("#hostinfo").textContent=s.public_host;
    if(!s.reality_tls)toast("提示：s-ui 里还没有 Reality 配置，VLESS-Reality 入站暂时不能用",6000);
    if((s.unprotected||[]).length){state.tab="manage";setTimeout(()=>toast(`⚠ ${s.unprotected.length} 个节点有安全风险，见页面顶部提醒`,6000),300)}}catch(e){return}
  render();
}
init();
</script>
