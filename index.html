<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中转助手</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#F4F1EB;--card:#FFFDF9;--soft:#F7F3EC;--ink:#1F1B16;--muted:#625849;--line:#E7E0D4;--line2:#D8CEBF;
  --pri:#D97757;--pri2:#C2613F;--ring:rgba(217,119,87,.30);
  --ok:#4E8A5A;--warn:#B57E22;--bad:#B8473A;--rail:#DCCDB9;
  --p-vless:#C8643F;--p-vless443:#3E6FA8;--p-hysteria2:#8A5BA8;--p-socks:#9A7838;
  --mono:Consolas,"SF Mono",Menlo,"Cascadia Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Microsoft YaHei UI","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",sans-serif;font-variant-numeric:tabular-nums}
::selection{background:#F5D8CB}

/* 顶栏：浅色，Logo 是两个站点连成一条线 */
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
header h1::before{content:"";width:24px;height:10px;flex:none;
  background:radial-gradient(circle at 5px 5px,var(--pri) 4px,transparent 4.5px),radial-gradient(circle at 19px 5px,var(--card) 2px,transparent 2.5px),radial-gradient(circle at 19px 5px,var(--pri) 4.5px,transparent 5px),linear-gradient(var(--pri),var(--pri)) 5px 4px/14px 2px no-repeat}
header .host{color:var(--muted);font:13px var(--mono);padding-left:14px;border-left:1px solid var(--line)}
header nav{margin-left:auto;display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
header nav button{background:transparent;color:#4A4135;border:0;border-radius:7px;padding:6px 16px;font-weight:600}
header nav button:hover{color:var(--ink);background:transparent}
header nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(43,38,32,.14),0 0 0 1px var(--line)}
header nav #logout{color:var(--muted);margin-left:6px;border-left:1px solid var(--line);border-radius:0 7px 7px 0}

.srvsel{margin-left:6px;padding:5px 10px;border-radius:8px;font-weight:600;max-width:240px}
#app.remote header{box-shadow:inset 0 -3px 0 var(--p-vless443)}
#app.remote .srvsel{border-color:var(--p-vless443);color:var(--p-vless443)}
main{max-width:1380px;margin:22px auto;padding:0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 14px;font-weight:600;color:var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}

input,select,textarea{font:inherit;border:1px solid var(--line2);border-radius:8px;padding:7px 11px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--soft)}
textarea:focus{background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
input::placeholder,textarea::placeholder{color:#958A7B}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:7px 15px;color:var(--ink);transition:background .12s,border-color .12s}
button:hover{background:var(--soft);border-color:#C9BBA8}
button:focus-visible,.ck:focus-within,a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.pri:hover{background:var(--pri2);border-color:var(--pri2)}
button.danger{color:var(--bad);border-color:#E3C2BE}
button.danger:hover{background:#F8ECEA;border-color:#D9A7A1}
button.sm{padding:3px 10px;font-size:13px;border-radius:6px}
button:disabled{opacity:.42;cursor:default;background:var(--card)}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0;line-height:1.65}

/* 表格 */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;background:transparent;white-space:nowrap;border-bottom:1px solid var(--line2);padding-top:4px}
td.mono,.mono{font-family:var(--mono);font-size:13px;color:var(--ink)}
td.mono{white-space:nowrap}

/* 标签：协议各有颜色，状态用对应颜色的浅底 */
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:500;line-height:20px;white-space:nowrap;--c:#6E6458;color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c) 20%,transparent)}
.tag.ok{--c:var(--ok)}.tag.bad{--c:var(--bad)}.tag.warn{--c:var(--warn)}.tag.gray{--c:#8A8073}
.tag.p-vless{--c:var(--p-vless)}.tag.p-vless443{--c:var(--p-vless443)}.tag.p-hysteria2{--c:var(--p-hysteria2)}.tag.p-socks{--c:var(--p-socks)}
.clk{cursor:pointer}.clk:hover{text-decoration:underline;text-underline-offset:3px}

/* 线路图：一条线路一根轨道，每个协议节点是一个站点，站点颜色 = 协议 */
tbody.grp{border-bottom:1px solid var(--line2)}
tbody.grp:hover{background:#FAF6EF}
tbody.grp tr:not(:last-child) td{border-bottom-color:transparent}
tbody.grp tr.sub td{border-top:0}
td.nm{position:relative;padding-left:34px;font-weight:600}
tbody.grp tr.sub td.nm{font-weight:500;color:#3A332B}
td.nm::before{content:"";position:absolute;left:15px;width:3px;border-radius:2px;background:var(--rail);top:50%;bottom:0}
tbody.grp tr.sub td.nm::before{top:0;bottom:0}
tbody.grp tr.sub:last-child td.nm::before{bottom:50%}
tbody.grp tr:only-child td.nm::before{display:none}
td.nm::after{content:"";position:absolute;left:10px;top:50%;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;box-sizing:border-box;background:var(--c,var(--pri));border:3px solid var(--card);box-shadow:0 0 0 2px var(--c,var(--pri))}
tbody.grp tr.sub td.nm::after{background:var(--card)}
td.nm.p-vless{--c:var(--p-vless)}td.nm.p-vless443{--c:var(--p-vless443)}td.nm.p-hysteria2{--c:var(--p-hysteria2)}td.nm.p-socks{--c:var(--p-socks)}
.branch{display:none}
.sib{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:400}

.acts{display:flex;gap:2px 4px;flex-wrap:wrap}
.acts button.sm{background:transparent;border-color:transparent;color:#2F2922;padding:3px 8px;font-weight:500}
.acts button.sm:hover{background:var(--card);border-color:var(--line2)}
.acts button.sm.danger{color:var(--bad)}
.acts button.sm.danger:hover{background:#F8ECEA;border-color:#E3C2BE}
.acts button.sm:disabled{background:transparent;border-color:transparent}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.res{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:var(--card)}
.res .name{font-weight:600;word-break:break-all}
.res .qr svg{width:180px;height:180px}
.res .link{font-size:11px;word-break:break-all;color:var(--muted);max-height:48px;overflow:hidden;margin:6px 0;font-family:var(--mono)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);background:var(--ink);color:#FBF5EC;padding:11px 20px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;z-index:9;box-shadow:0 8px 24px rgba(43,38,32,.22)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(43,38,32,.36);display:none;align-items:center;justify-content:center;z-index:8;padding:16px;backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:14px;padding:22px 24px;max-width:580px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(43,38,32,.25)}
.modal .box h2{font-size:17px}
.modal .box:has(#poolbox){max-width:720px}
#poolbox td,#poolbox button,#ppl td{white-space:nowrap}
.modal .box table th{background:transparent}

.login{max-width:380px;margin:14vh auto;padding:28px}
.login h2{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:18px}
.login h2::before{content:"";width:24px;height:10px;flex:none;
  background:radial-gradient(circle at 5px 5px,var(--pri) 4px,transparent 4.5px),radial-gradient(circle at 19px 5px,var(--card) 2px,transparent 2.5px),radial-gradient(circle at 19px 5px,var(--pri) 4.5px,transparent 5px),linear-gradient(var(--pri),var(--pri)) 5px 4px/14px 2px no-repeat}

.protos{display:flex;gap:6px;flex-wrap:wrap}
.ck{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:6px 11px;color:var(--ink)!important;font-size:13px!important;cursor:pointer;background:var(--card);transition:background .12s,border-color .12s}
.ck:hover{border-color:#C9BBA8}
.ck:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.ck input{margin:0;accent-color:var(--pri)}
input[type=checkbox],input[type=radio]{accent-color:var(--pri)}
.btnlink{display:inline-block;border:1px solid var(--line2);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--ink);text-decoration:none;background:var(--card)}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:5px;background:#EDE5D9;border-radius:3px;overflow:hidden;margin:4px 0;width:100px}.bar i{display:block;height:100%;border-radius:3px}
.dupbox{margin-top:6px;font-size:12px;color:#7A4E0F;background:#FAF2E2;border:1px solid #E9D3A6;border-radius:8px;padding:6px 8px}.dupbox select{margin-top:4px;width:100%;font-size:12px;padding:4px 6px}
.warnbox{background:#FAF2E2;border:1px solid #E5CC97;border-left:4px solid var(--warn);color:#5E4310;border-radius:10px;padding:14px 18px;margin-bottom:16px;line-height:1.75}
.kv{display:grid;grid-template-columns:70px 1fr auto;gap:6px 8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.kv b{font-weight:500;color:var(--muted);font-size:12px}.kv span{font-family:var(--mono);font-size:12px;word-break:break-all}
.muted{color:var(--muted)}
.err{color:var(--bad)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #E2D6C6;border-top-color:var(--pri);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:2s}}
@media(max-width:720px){.hide-sm{display:none}header{flex-wrap:wrap;padding:10px 14px}header nav{margin-left:0;width:100%;overflow-x:auto}header .host{display:none}main{padding:0 10px}.card{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
const BASE="__BASE__";
const $=s=>document.querySelector(s);
const H=(sel,html)=>{const e=document.querySelector(sel);if(e)e.innerHTML=html;return e};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let state={srv:LS.get("rh_srv")||"local",servers:[],tab:"create",preview:null,results:null,relays:[],now:0,host:"",q:"",page:1,sel:new Set(),checks:{},busy:false};

async function api(a,body,opt){
  const hd={"Content-Type":"application/json"};if(state.srv&&state.srv!=="local"&&!(opt&&opt.local))hd["X-RH-Server"]=state.srv;
  const r=await fetch(BASE+"api/"+a,{method:"POST",headers:hd,body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({ok:false,error:"服务器无响应"}));
  if(j.login){renderLogin();throw new Error("请先登录")}
  if(!j.ok)throw new Error(j.error||"操作失败");
  return j;
}
function toast(m,ms=2600){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms)}
function modal(html){$("#mbox").innerHTML=html;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("已复制")).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("已复制")})}
function coreMsg(c){if(c==="restarted")return "，已重启 s-ui 使路由生效（约 3 秒断线）";if(c==="down")return "。⚠ s-ui 内核未能启动，请登录服务器执行 systemctl restart s-ui";return ""}
const fmtDate=ts=>{if(!ts)return "永久";const d=new Date(ts*1000);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
function daysLeft(ts){if(!ts)return null;const d=(ts*1000-Date.now())/86400000;return d<0?-1:Math.ceil(d)}
function expTag(r){const d=daysLeft(r.expiry);if(d!==null&&d<0)return '<span class="tag bad">已过期</span>';if(r.enable===false)return '<span class="tag gray">已停用</span>';if(d===null)return '<span class="tag ok">永久</span>';if(d<0)return '<span class="tag bad">已过期</span>';if(d<=7)return `<span class="tag warn">${d} 天</span>`;return `<span class="tag ok">${d} 天</span>`}
const protoName={vless:"VLESS-Reality",vless443:"VLESS-443共用",hysteria2:"Hysteria2",socks:"SOCKS5",mixed:"Mixed",vmess:"VMess",trojan:"Trojan",shadowsocks:"SS",tuic:"TUIC",anytls:"AnyTLS",http:"HTTP"};

function renderLogin(){
  $("#app").innerHTML=`<div class="card login"><h2>登录中转助手</h2>
  <input id="un" placeholder="账号（和 s-ui 面板一样）" style="width:100%" autocomplete="username" autofocus>
  <input id="pw" type="password" placeholder="密码（和 s-ui 面板一样）" style="width:100%;margin-top:10px" autocomplete="current-password">
  <div style="margin-top:12px"><button class="pri" id="lg" style="width:100%">登录</button></div><p class="err" id="lerr"></p>
  <p class="hint" style="margin-top:6px">s-ui 连不上时，账号留空、用中转助手的备用密码登录。</p></div>`;
  const go=async()=>{try{await api("login",{username:$("#un").value.trim(),password:$("#pw").value});init()}catch(e){$("#lerr").textContent=e.message}};
  $("#lg").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};$("#un").onkeydown=e=>{if(e.key==="Enter")$("#pw").focus()};
}

function shell(){
  $("#app").innerHTML=`<header><h1>中转助手</h1><span class="host" id="hostinfo"></span><select id="srvsel" class="srvsel" title="选择要管理的服务器" style="display:none"></select>
  <nav><button data-t="create">一键中转</button><button data-t="manage">线路管理</button><button data-t="pool">落地库</button><button data-t="backup">备份</button><button data-t="settings">设置</button><button data-t="servers">服务器</button><button id="logout">退出</button></nav></header><main id="main"></main>`;
  document.querySelectorAll("header nav button[data-t]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render()});
  $("#logout").onclick=async()=>{await fetch(BASE+"api/logout",{method:"POST"});renderLogin()};
}
function render(){
  document.querySelectorAll("header nav button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===state.tab));
  if(state.tab==="create")renderCreate();else if(state.tab==="backup")renderBackup();else if(state.tab==="settings")renderSettings();else if(state.tab==="servers")renderServers();else if(state.tab==="pool")renderPool();else renderManage();
}
async function loadServers(){
  try{const x=await api("servers_list",{},{local:true});state.servers=x.servers;state.local=x.local}catch(e){state.servers=[]}
  if(state.srv!=="local"&&!state.servers.some(s=>s.id===state.srv)){state.srv="local";LS.set("rh_srv","local")}
  const sel=$("#srvsel");if(!sel)return;
  sel.style.display=state.servers.length?"":"none";
  sel.innerHTML=`<option value="local">本机 · ${esc((state.local||{}).public_host||"")}</option>`+state.servers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("");
  sel.value=state.srv;$("#app").classList.toggle("remote",state.srv!=="local");
  sel.onchange=()=>switchSrv(sel.value);
}
function switchSrv(id,tab){
  state.srv=id;LS.set("rh_srv",id);state.relays=[];state.sel=new Set();state.q="";state.page=1;state.only=null;
  if($("#srvsel"))$("#srvsel").value=id;$("#app").classList.toggle("remote",id!=="local");
  if(tab)state.tab=tab;if(state.tab==="servers")state.tab="manage";
  api("status").then(s=>{state.host=s.public_host;$("#hostinfo").textContent=s.public_host}).catch(e=>toast(e.message,6000));
  render();
}

/* ---------------- 一键中转 ---------------- */
function renderCreate(){
  const m=$("#main");
  const saved=JSON.parse(localStorage.getItem("rh_form")||"{}");
  m.innerHTML=`<div class="card"><h2>1. 选择类型</h2>
  <div class="modes" id="modes"><label class="ck"><input type="radio" name="mode" value="relay">中转（粘贴落地，走落地 IP 出网）</label>
  <label class="ck"><input type="radio" name="mode" value="direct">直连（不用落地，走本服务器 IP 出网）</label></div>
  <div class="row" style="margin-top:12px">
    <label>客户名 <input id="cust" placeholder="如：见山" value="${esc(saved.cust||"")}"></label>
    <label>入站协议（客户连接用，可多选）<span class="protos" id="protos">
      <label class="ck"><input type="checkbox" value="vless">VLESS-Reality</label>
      <label class="ck"><input type="checkbox" value="hysteria2">Hysteria2</label>
      <label class="ck"><input type="checkbox" value="socks">SOCKS5</label>
      <label class="ck" title="所有客户共用一个 443 端口（像普通 HTTPS），按用户分流到各自落地；不占新端口"><input type="checkbox" value="vless443">VLESS-443 共用</label></span></label>
    <label>到期 <select id="days"><option value="30">30 天</option><option value="60">60 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option><option value="0">永久</option><option value="custom">指定日期…</option></select></label>
    <label id="cdl" style="display:none">到期日期 <input id="cdate" type="datetime-local"></label>
    <label>流量上限 GB（0=不限）<input id="qgb" type="number" min="0" step="1" value="${esc(saved.qgb??0)}" style="width:120px"></label>
    <label>设备数（0=不限）<input id="qdev" type="number" min="0" step="1" value="${esc(saved.qdev??0)}" style="width:110px"></label>
  </div>
  <div id="dcnt" class="row" style="margin-top:12px;display:none"><label>创建几条直连线路<input id="dn" type="number" min="1" max="100" value="1" style="width:110px"></label>
    <span class="hint">每条线路单独计流量、设备和到期；出口 IP 都是本服务器（${esc(state.host||"")}）。</span></div>
  <div style="margin-top:12px" id="txtbox"><textarea id="txt" placeholder="每行一条落地，支持：
socks5://账号:密码@IP:端口
IP:端口:账号:密码
vless://…  hy2://…  ss://…  trojan://…  vmess://…  tuic://…
也可以在前面加名字：  我的线路A socks5://账号:密码@IP:端口"></textarea></div>
  <p class="hint" id="relayhint">节点名自动生成为「落地国家 + 客户名 + 落地IP」，下一步可以改。多选协议时，同一落地会生成多个节点（第二个起名字后加 -HY2 / -S5），共用这个落地。</p>
  <div class="row" style="margin-top:10px"><button class="pri" id="pv">解析预览</button><button id="frompool">从落地库选</button></div></div>
  <div id="pvbox"></div><div id="resbox"></div>`;

/* 最小 ZIP 打包（不压缩，PNG 本身已压缩）；文件名用 UTF-8 并设置 UTF-8 标志，Windows 自带解压能正确显示中文 */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
    c.setUint16(28,name.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);

async function downloadAllZip(items,zipName){

/* 同一落地（同一个落地出站）的节点算一组：同一客户同一条线路的不同协议 */
const PORD={vless:0,vless443:1,hysteria2:2,socks:3};
const gkey=r=>r.outbound_tag?"o:"+r.outbound_tag:"t:"+r.tag;
function groupsOf(list){
  const m=new Map();for(const r of list){const k=gkey(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)}
  const gs=[...m.values()];
  gs.forEach(g=>g.sort((a,b)=>((PORD[a.type]??9)-(PORD[b.type]??9))||((a.inbound_id||0)-(b.inbound_id||0))));
  // 新建的线路在前：按落地出站的 id（每条线路建时新建），共用 443 的节点入站 id 都一样，不能用来排序
  const gid=g=>Math.max(...g.map(x=>x.outbound_id||0)),iid=g=>Math.max(...g.map(x=>x.shared?0:(x.inbound_id||0)));
  gs.sort((a,b)=>(gid(b)-gid(a))||(iid(b)-iid(a)));
  return gs;
}
const groupOf=t=>{const r=byTag(t);if(!r)return [];const k=gkey(r);return state.relays.filter(x=>gkey(x)===k)};
const expand=tags=>[...new Set(tags.flatMap(t=>groupOf(t).map(x=>x.tag)))];
function searched(){const q=state.q.toLowerCase();
  return groupsOf(state.relays).filter(g=>!q||g.some(r=>[r.tag,r.landing,r.port,r.outbound_tag].join(" ").toLowerCase().includes(q)))}
const withC=g=>g.filter(r=>r.client_id);
const isExp=g=>withC(g).length>0&&withC(g).every(r=>{const d=daysLeft(r.expiry);return d!==null&&d<0});
const isOff=g=>withC(g).length>0&&withC(g).every(r=>r.enable===false)&&!isExp(g);
const isBad=g=>{const c=(state.checks||{})[g[0].tag];if(c)return c.ok===false;const h=(state.health||{})[okeyOf(g[0])];return !!(h&&h.ok===false)};
const ONLY={off:["已停用",isOff],exp:["已过期",isExp],bad:["落地不通",isBad]};
function filtered(){const gs=searched();return state.only&&ONLY[state.only]?gs.filter(ONLY[state.only][1]):gs}

   <button class="sm" id="seloff" ${offG.length?"":"disabled"} title="整条线路的客户端都已停用、但没过期（手动停用或流量用完）">选中已停用（${offG.length}）</button>

   <button class="sm" id="bchk">批量检测</button><button class="sm" id="bren">批量续期</button><button class="sm" id="baddp">批量加协议</button><button class="sm" id="blim">批量限额</button><button class="sm" id="bdis">停用</button><button class="sm" id="ben">启用</button>

  ${i===0?`<button class="sm" data-a="sub" data-t="${esc(r.tag)}" ${r.client_id?"":"disabled"} title="这条线路所有协议节点的订阅链接，客户导入一次，以后刷新就自动更新">订阅</button>`:""}

  <button class="sm danger" data-a="del" data-t="${esc(r.tag)}">删除</button></div></td></tr>`).join("")}</tbody>`}).join("")}</table>`;
  $("#pg").innerHTML=pages>1?`<button class="sm" id="pp" ${state.page<=1?"disabled":""}>上一页</button><span>${state.page} / ${pages}</span><button class="sm" id="np" ${state.page>=pages?"disabled":""}>下一页</button>`:"";

  $("#apcl").onclick=closeModal;
  $("#apok").onclick=async()=>{const protos=selProtos("#aps");if(!protos.length)return toast("请选择协议");
    if(!confirm("添加后会重启 s-ui 让路由生效，所有线路约断 3 秒。继续？"))return;
    const b=$("#apok");b.disabled=true;b.innerHTML='<span class="spin"></span> 添加中…';
    try{const x=await api("add_protocol",{tags:rs.map(r=>r.tag),protocols:protos});
      const ok=x.results.filter(z=>z.ok),skip=x.results.filter(z=>z.skipped),bad=x.results.filter(z=>!z.ok&&!z.skipped);
      toast(`新增 ${ok.length} 个节点${skip.length?`，跳过 ${skip.length} 个`:""}${bad.length?`，失败 ${bad.length} 个`:""}${coreMsg(x.core)}`,5000);
      await loadRelays();drawTable();showNew(ok,bad)}catch(e){toast(e.message,5000);if(b.isConnected){b.disabled=false;b.textContent="添加"}}};
}
async function showNew(ok,bad){
  if(!ok.length&&!bad.length)return closeModal();
  modal(`<h2 style="margin-top:0">新增节点（${ok.length}）</h2>${bad.map(x=>`<p class="err">✗ ${esc(x.name)}：${esc(x.error)}</p>`).join("")}
  <div class="results">${ok.map((x,i)=>`<div class="res"><div class="name">${esc(x.name)}</div><div class="muted">${esc(protoName[x.protocol]||"")} · 端口 ${x.port}</div>
  <div class="qr" id="nq${i}"><span class="spin"></span></div><div class="acts" style="justify-content:center"><button class="sm" data-ncp="${i}">复制链接</button><button class="sm" data-ndl="${i}">下载二维码</button></div></div>`).join("")}</div>
  <div class="row" style="margin-top:12px"><button class="pri" id="ncpall">复制全部链接</button><button id="ndlall">下载全部二维码</button><button id="ncl">关闭</button></div>`);
  $("#ndlall").onclick=()=>downloadAllZip(ok.map(x=>({name:x.name,svg:x.svg,port:x.port,uri:(x.links||[])[0]})),"新增节点_二维码");
  $("#ncl").onclick=closeModal;$("#ncpall").onclick=()=>copy(ok.map(x=>(x.links||[])[0]).filter(Boolean).join("\n"));
  document.querySelectorAll("[data-ncp]").forEach(b=>b.onclick=()=>copy(ok[b.dataset.ncp].links[0]));
  for(let i=0;i<ok.length;i++){try{const q=await api("qr",{text:ok[i].links[0]});ok[i].svg=q.svg;H("#nq"+i,q.svg)}catch(e){}}
  document.querySelectorAll("[data-ndl]").forEach(b=>b.onclick=()=>{const x=ok[b.dataset.ndl];downloadQR(x.name,x.svg,x.port)});
}
function limitDlg(tags){
  const gs=[];const seen=new Set();for(const t of tags){const g=groupOf(t);if(!g.length)continue;const k=okeyOf(g[0]);if(!seen.has(k)){seen.add(k);gs.push(g)}}
  if(!gs.length)return;
  const L=gs.length===1?((state.limits||{})[okeyOf(gs[0][0])]||{}):{};
  const used=gs.length===1?gs[0].reduce((s,r)=>s+(r.up||0)+(r.down||0),0):null;
  modal(`<h2 style="margin-top:0">限额（${gs.length} 条线路）</h2>
  <p class="hint">按整条线路算：同一落地的几个协议节点流量合计、设备合计。流量用完整条线路自动停用；设备满了以后新设备连不上，旧设备断开约 3～4 分钟后释放名额。设备按客户的 IP 地址算，同一网络下的多台电脑算 1 台。</p>
  ${used!==null?`<p>当前已用：<b>${fmtB(used)}</b>${L.over?' <span class="tag bad">超流量，已停用</span>':""}</p>`:""}
  <div class="row"><label>流量上限 GB（0=不限）<input id="lq" type="number" min="0" step="1" value="${gs.length===1?(L.quota_gb||0):""}" placeholder="不修改" style="width:140px"></label>
  <label>设备数（0=不限）<input id="ld" type="number" min="0" step="1" value="${gs.length===1?(L.devices||0):""}" placeholder="不修改" style="width:120px"></label></div>
  <div class="row" style="margin-top:14px"><button class="pri" id="lok">保存</button><button id="lrst">流量清零</button><button id="lcl">取消</button></div>`);
  $("#lcl").onclick=closeModal;
  const tagsOf=()=>gs.map(g=>g[0].tag);
  $("#lok").onclick=async()=>{const body={tags:tagsOf()};if($("#lq").value!=="")body.quota_gb=parseFloat($("#lq").value)||0;if($("#ld").value!=="")body.devices=parseInt($("#ld").value)||0;
    if(!("quota_gb" in body)&&!("devices" in body))return toast("没有要修改的");
    try{await api("set_limits",body);closeModal();toast("已保存限额");await loadRelays();drawTable()}catch(e){toast(e.message)}};
  $("#lrst").onclick=async()=>{if(!confirm(`把 ${gs.length} 条线路的已用流量清零？超流量停用的会自动恢复（未过期的）。`))return;
    try{await api("reset_traffic",{tags:tagsOf()});closeModal();toast("已清零流量");await loadRelays();drawTable()}catch(e){toast(e.message)}};
}
function renewDlg(tags){
  const gmap=new Map();for(const t of expand(tags)){const r=byTag(t);if(r&&r.client_id){const k=gkey(r);if(!gmap.has(k))gmap.set(k,[]);gmap.get(k).push(r)}}
  const gs=[...gmap.values()];if(!gs.length)return toast("所选线路没有用户");
  const nn=gs.reduce((s,g)=>s+g.length,0);
  modal(`<h2 style="margin-top:0">续期 ${gs.length} 条线路（${nn} 个节点）</h2>
  ${nn>gs.length?'<p class="hint">同一落地的其他协议节点会一起续期，到期时间统一成同一天。</p>':""}
  <div class="row"><label>方式<select id="rm"><option value="add">在原到期时间上延长</option><option value="set">设为指定日期</option><option value="forever">改为永久</option></select></label>
  <label id="ral">延长天数<input id="rd" type="number" value="30" min="1" style="width:100px"></label>
  <label id="rsl" style="display:none">到期日期<input id="rdt" type="datetime-local"></label></div>
  <label class="ck" style="margin-top:8px"><input type="checkbox" id="rrst" checked>同时清零流量（流量限额重新计算）</label>
  <p class="hint">从这组里最晚的到期时间开始延长；已过期的从今天开始算；续期后自动重新启用。</p>
  <div class="row" style="margin-top:12px"><button class="pri" id="rnok">确定</button><button id="rncl">取消</button></div>`);
  const sync=()=>{const v=$("#rm").value;$("#ral").style.display=v==="add"?"flex":"none";$("#rsl").style.display=v==="set"?"flex":"none"};$("#rm").onchange=sync;
  $("#rncl").onclick=closeModal;
  $("#rnok").onclick=async()=>{const mode=$("#rm").value;const now=Math.floor(Date.now()/1000);
    try{let byExp={};
      for(const g of gs){let e;
        if(mode==="forever")e=0;
        else if(mode==="set"){if(!$("#rdt").value)throw new Error("请选择日期");e=Math.floor(new Date($("#rdt").value).getTime()/1000)}
        else{const base=g.some(r=>!r.expiry)?now:Math.max(...g.map(r=>r.expiry));e=Math.max(base,now)+parseInt($("#rd").value||"0")*86400}
        for(const r of g)(byExp[e]=byExp[e]||new Set()).add(r.client_id)}
      let fail=0;for(const[e,ids]of Object.entries(byExp)){const x=await api("update_clients",{client_ids:[...ids],expiry:parseInt(e),reset_traffic:$("#rrst").checked});fail+=x.results.filter(z=>!z.ok).length}
      closeModal();toast(fail?`${fail} 个失败`:`已续期 ${nn} 个节点`);await loadRelays();drawTable()}catch(e){toast(e.message)}};
}
async function setEnable(tags,en){
  const ids=[...new Set(expand(tags).map(byTag).filter(r=>r&&r.client_id).map(r=>r.client_id))];
  if(!en&&!confirm(`停用 ${ids.length} 个节点（含同落地的其他协议）？停用后客户无法连接。`))return;
  try{const x=await api("update_clients",{client_ids:ids,enable:en});toast(en?"已启用":"已停用");await loadRelays();drawTable()}catch(e){toast(e.message)}
}
async function delTags(tags){
  const set=new Set(tags);const left=[...new Set(tags.flatMap(t=>groupOf(t).filter(x=>!set.has(x.tag)).map(x=>x.tag)))];
  if(!confirm(`确定删除 ${tags.length} 个节点？${left.length?`\n同落地的这些节点会保留：${left.join("、")}`:"\n落地出站没有其他节点使用时会一起删除。"}\n删除后会重启 s-ui（约 3 秒断线），不可恢复。`))return;
  toast("删除中…",15000);
  try{const x=await api("delete",{tags});const bad=x.results.filter(r=>!r.ok);
    tags.forEach(t=>state.sel.delete(t));toast((bad.length?`${bad.length} 条失败：${bad.map(b=>b.error).join("；")}`:"已删除")+coreMsg(x.core),5000);
    await loadRelays();drawTable()}catch(e){toast(e.message)}
}

async function init(){
  shell();await loadServers();
  try{const s=await api("status");state.host=s.public_host;$("#hostinfo").textContent=s.public_host;
    if(!s.reality_tls)toast("提示：s-ui 里还没有 Reality 配置，VLESS-Reality 入站暂时不能用",6000);
    if((s.unprotected||[]).length){state.tab="manage";setTimeout(()=>toast(`⚠ ${s.unprotected.length} 个节点有安全风险，见页面顶部提醒`,6000),300)}}catch(e){return}
  render();
}
init();
</script>
